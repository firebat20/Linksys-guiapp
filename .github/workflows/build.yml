name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            output: LinksysRouterManager-linux-amd64
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            output: LinksysRouterManager-windows-amd64.exe
          - name: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            output: LinksysRouterManager-darwin-arm64
          - name: macos-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            output: LinksysRouterManager-darwin-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go tests
        if: matrix.goos != 'darwin' || matrix.goarch == 'arm64'
        run: go test ./...

      - name: Generate Windows resources (.syso)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          $gopathBin = Join-Path (go env GOPATH) "bin"
          $env:PATH = "$gopathBin;$env:PATH"
          wails3 generate syso `
            -arch ${{ matrix.goarch }} `
            -icon build/windows/icon.ico `
            -info build/windows/info.json `
            -manifest build/windows/wails.exe.manifest `
            -out rsrc_windows_${{ matrix.goarch }}.syso

      - name: Build application (Linux / macOS)
        if: matrix.goos != 'windows'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -tags production -ldflags="-w -s" -o "dist/${{ matrix.output }}" .

      - name: Build application (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -tags production -ldflags="-w -s -H windowsgui" -o "dist/${{ matrix.output }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
